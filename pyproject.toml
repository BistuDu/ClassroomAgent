[project]
name = "openmaic-python"
version = "0.1.0"
description = "Autonomous Pi-powered narrated web classrooms"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "pillow>=11",
  "playwright>=1.51,<2",
  "jsonpatch>=1.33,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
